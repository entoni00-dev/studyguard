# Workflow TEMPORANEO: ricompone l'installer Windows dalle 5 parti, ne verifica lo SHA-256
# e lo allega alla release v0.43.0. Il ramo viene cancellato subito dopo.
name: Carica installer Windows
on:
  push:
    branches: [upload-windows-installer]
permissions:
  contents: write
jobs:
  upload:
    # parte solo con il commit finale, quando tutte le parti sono state caricate
    if: contains(github.event.head_commit.message, '[carica]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ricomponi e verifica
        run: |
          cat parts/StudyGuard-Setup-Windows.exe.part0* > StudyGuard-Setup-Windows.exe
          ls -l StudyGuard-Setup-Windows.exe
          echo "1db3f3bde092c08672d159c3d8b2d17dfb05419006f17bb927cbb00fbd30f7f0  StudyGuard-Setup-Windows.exe" | sha256sum -c -
      - name: Allega alla release v0.43.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.43.0 StudyGuard-Setup-Windows.exe --clobber -R "$GITHUB_REPOSITORY"
